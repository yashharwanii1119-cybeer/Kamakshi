<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191719"/>
      <stop offset="50%" stop-color="#360B19"/>
      <stop offset="100%" stop-color="#110307"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#metBg)"/>

  <!-- High-Rise Building Integrated PV Facade -->
  <polygon points="400,240 800,240 860,780 340,780" fill="#1e040c" stroke="#70152D" stroke-width="2"/>
  
  <!-- BIPV Glass Matrix Grid -->
  <g stroke="#C62845" stroke-opacity="0.6" stroke-width="1.2">
    <line x1="390" y1="320" x2="810" y2="320"/>
    <line x1="380" y1="400" x2="820" y2="400"/>
    <line x1="370" y1="480" x2="830" y2="480"/>
    <line x1="360" y1="560" x2="840" y2="560"/>
    <line x1="350" y1="640" x2="850" y2="640"/>
    
    <!-- Vertical Mullions -->
    <line x1="480" y1="240" x2="450" y2="780"/>
    <line x1="600" y1="240" x2="600" y2="780"/>
    <line x1="720" y1="240" x2="750" y2="780"/>
  </g>

  <!-- Solar Carport Canopies at Base -->
  <polygon points="120,720 300,680 340,740 140,780" fill="#2c0612" stroke="#E44743" stroke-width="2"/>
  <polygon points="860,680 1040,720 1020,780 840,740" fill="#2c0612" stroke="#E44743" stroke-width="2"/>

  <text x="80" y="120" fill="#FFFFFF" font-family="Space Grotesk, sans-serif" font-size="40" font-weight="bold">Nexus Innovation Tower &amp; Solar Skin</text>
  <text x="80" y="165" fill="#E9B85B" font-family="monospace" font-size="18" letter-spacing="1">4.8 MWp CANOPY &amp; BUILDING-INTEGRATED PV // LEED PLATINUM</text>
</svg>
