<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="utBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191719"/>
      <stop offset="60%" stop-color="#360B19"/>
      <stop offset="100%" stop-color="#0a0205"/>
    </linearGradient>
    <linearGradient id="sunGlowUt" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#E9B85B" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#E44743" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#191719" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#utBg)"/>
  <circle cx="950" cy="220" r="180" fill="url(#sunGlowUt)"/>

  <!-- High-Voltage Transmission Pylons -->
  <g stroke="#70152D" stroke-width="2" opacity="0.6">
    <line x1="1050" y1="200" x2="1080" y2="450"/>
    <line x1="1110" y1="200" x2="1080" y2="450"/>
    <line x1="1040" y1="280" x2="1120" y2="280"/>
    <line x1="1050" y1="360" x2="1110" y2="360"/>
  </g>

  <!-- Rolling Horizon Landscape -->
  <path d="M 0 480 Q 300 420 600 470 T 1200 460 L 1200 800 L 0 800 Z" fill="#140309"/>

  <!-- Utility Single-Axis Trackers -->
  <g stroke="#C62845" stroke-width="1.8" fill="#1d040c">
    <!-- Pylons & Arrays Tracker 1 -->
    <polygon points="120,520 280,480 320,540 160,580"/>
    <line x1="220" y1="530" x2="220" y2="650" stroke="#70152D" stroke-width="3"/>
    
    <!-- Tracker 2 -->
    <polygon points="360,520 520,480 560,540 400,580"/>
    <line x1="460" y1="530" x2="460" y2="650" stroke="#70152D" stroke-width="3"/>

    <!-- Tracker 3 -->
    <polygon points="600,520 760,480 800,540 640,580"/>
    <line x1="700" y1="530" x2="700" y2="650" stroke="#70152D" stroke-width="3"/>

    <!-- Tracker 4 -->
    <polygon points="840,520 1000,480 1040,540 880,580"/>
    <line x1="940" y1="530" x2="940" y2="650" stroke="#70152D" stroke-width="3"/>

    <!-- Foreground Tracker 5 -->
    <polygon points="260,620 480,570 540,660 320,720"/>
    <polygon points="560,620 780,570 840,660 620,720"/>
  </g>

  <!-- Grid Interconnection Vector -->
  <path d="M 220 650 L 460 650 L 700 650 L 940 650 L 1080 450" fill="none" stroke="#E44743" stroke-width="2.5" stroke-dasharray="10 6"/>

  <text x="80" y="140" fill="#FFFFFF" font-family="Space Grotesk, sans-serif" font-size="44" font-weight="bold">Utility-Scale Photovoltaics</text>
  <text x="80" y="190" fill="#E44743" font-family="monospace" font-size="20" letter-spacing="2">TERRAIN-FOLLOWING 3D TRACKERS // 1500V DC</text>
</svg>
