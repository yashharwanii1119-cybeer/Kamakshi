<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Dark Charcoal Background Gradient -->
    <linearGradient id="kmt-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D3035" />
      <stop offset="50%" stop-color="#202124" />
      <stop offset="100%" stop-color="#111214" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="kmt-gold" x1="16" y1="12" x2="48" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDF0CD" />
      <stop offset="35%" stop-color="#F5D985" />
      <stop offset="70%" stop-color="#D4A64A" />
      <stop offset="100%" stop-color="#9B6A23" />
    </linearGradient>

    <!-- Solar Panel Blue Gradient -->
    <linearGradient id="kmt-solar-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A588D" />
      <stop offset="50%" stop-color="#263D67" />
      <stop offset="100%" stop-color="#1A2944" />
    </linearGradient>

    <!-- Cyan Lightning Glow -->
    <linearGradient id="kmt-cyan" x1="28" y1="18" x2="36" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B6FAFF" />
      <stop offset="50%" stop-color="#65E8F4" />
      <stop offset="100%" stop-color="#00C8DF" />
    </linearGradient>

    <filter id="kmt-glow" x="20" y="14" width="24" height="36" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagonal Container -->
  <rect width="64" height="64" rx="16" fill="url(#kmt-bg)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="#D4A64A" stroke-opacity="0.35" stroke-width="1.2" />

  <!-- Gold Sun Rays (Triangular) -->
  <polygon points="32,6 28,15 36,15" fill="url(#kmt-gold)" />
  <polygon points="21,10 21,20 28,17" fill="url(#kmt-gold)" />
  <polygon points="43,10 36,17 43,20" fill="url(#kmt-gold)" />
  <polygon points="12,18 17,26 23,21" fill="url(#kmt-gold)" />
  <polygon points="52,18 41,21 47,26" fill="url(#kmt-gold)" />

  <!-- Rising Sun Disc -->
  <circle cx="32" cy="27" r="10" fill="url(#kmt-gold)" />
  <circle cx="32" cy="27" r="8" fill="#202124" />

  <!-- Left Solar Panel Wing (Angled) -->
  <polygon points="8,26 24,28 20,44 6,38" fill="url(#kmt-solar-blue)" stroke="#D4A64A" stroke-width="0.8" />
  <!-- Panel Gridlines -->
  <line x1="16" y1="27" x2="13" y2="41" stroke="#65E8F4" stroke-opacity="0.5" stroke-width="0.6" />
  <line x1="7" y1="32" x2="22" y2="34" stroke="#65E8F4" stroke-opacity="0.5" stroke-width="0.6" />
  <line x1="6.5" y1="35" x2="21" y2="39" stroke="#65E8F4" stroke-opacity="0.5" stroke-width="0.6" />

  <!-- Right Solar Panel Wing (Angled) -->
  <polygon points="40,28 56,26 58,38 44,44" fill="url(#kmt-solar-blue)" stroke="#D4A64A" stroke-width="0.8" />
  <!-- Panel Gridlines -->
  <line x1="48" y1="27" x2="51" y2="41" stroke="#65E8F4" stroke-opacity="0.5" stroke-width="0.6" />
  <line x1="42" y1="34" x2="57" y2="32" stroke="#65E8F4" stroke-opacity="0.5" stroke-width="0.6" />
  <line x1="43" y1="39" x2="57.5" y2="35" stroke="#65E8F4" stroke-opacity="0.5" stroke-width="0.6" />

  <!-- Cyan Lightning Bolt (Center Feature) -->
  <polygon points="34,16 28,29 32.5,29 30,42 37.5,27 33,27" fill="url(#kmt-cyan)" filter="url(#kmt-glow)" />

  <!-- Gold Ribbon Underline Arc / Accent -->
  <path d="M14 48 C 24 53, 40 53, 50 48" stroke="url(#kmt-gold)" stroke-width="2" stroke-linecap="round" fill="none" />
  <circle cx="32" cy="51" r="1.5" fill="#65E8F4" />
</svg>